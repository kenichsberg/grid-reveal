[package]
name = "grid-reveal-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "macros",
    "migrate",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"

uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

ts-rs = { version = "10", features = ["uuid-impl", "chrono-impl", "serde-compat"] }

# Decoding only: `image` 0.25 removed its WebP encoder.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# WebP encoding via vendored libwebp. Needs a C compiler at build time.
webp = "0.3"

# S3-compatible client for Cloudflare R2. Chosen over aws-sdk-s3, which pulls
# ~380 crates and requires a newer Rust than the project targets, for an API
# surface we use three methods of.
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
# Cookie max-age durations (the `cookie` crate's clock type).
time = "0.3"
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
