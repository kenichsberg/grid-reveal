server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are client-side routes, so /s/k3m9xq2p
    # must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache indefinitely.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must not be cached, or a deploy would not reach open tabs.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
